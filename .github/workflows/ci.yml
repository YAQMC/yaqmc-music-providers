name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo fmt --manifest-path plugins/guest-core/Cargo.toml -- --check
      - run: cargo test --manifest-path plugins/guest-core/Cargo.toml --locked
      - run: cargo fmt --manifest-path plugins/spotify/Cargo.toml -- --check
      - run: cargo fmt --manifest-path plugins/netease/Cargo.toml -- --check
      - run: cargo fmt --manifest-path plugins/kugou/Cargo.toml -- --check
      - run: cargo fmt --manifest-path plugins/music/Cargo.toml -- --check
      - run: cargo test --manifest-path plugins/music/Cargo.toml --locked
      - run: cargo clippy --manifest-path plugins/music/Cargo.toml --all-targets --locked -- -D warnings
      - run: pwsh ./scripts/build.ps1 -OutputDirectory dist/ci
      - run: pwsh ./scripts/validate.ps1 -SkipBuild -PackageDirectory dist/ci
      - run: pwsh ./scripts/test-packaging.ps1 -PackageDirectory dist/ci
      - uses: actions/upload-artifact@v4
        with:
          name: music-provider-wasm
          path: dist/ci/*.yaqmc-plugin
          if-no-files-found: error
