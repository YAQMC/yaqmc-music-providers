[workspace]
members = [
    "crates/protocol",
    "crates/backend",
    "crates/platforms",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/YAQMC/yaqmc-music-providers"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
