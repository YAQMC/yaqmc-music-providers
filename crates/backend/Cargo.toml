[package]
name = "yaqmc-music-providers-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "yaqmc_music_providers_backend"
path = "src/lib.rs"

[[bin]]
name = "yaqmc-music-providers"
path = "src/main.rs"

[dependencies]
axum = "0.8"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "io-util", "io-std", "signal", "sync"] }
toml = "0.9"
uuid = { version = "1.18", features = ["v4", "fast-rng"] }
url = "2.5"
yaqmc-music-providers-platforms = { path = "../platforms" }
yaqmc-music-providers-protocol = { path = "../protocol" }

[dev-dependencies]
httpmock = "0.7"
